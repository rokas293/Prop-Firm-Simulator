[project]
name = "propbt"
version = "0.1.0"
description = "Prop firm eval backtesting framework (Topstep $50k Combine)"
requires-python = ">=3.11"
dependencies = [
    "pandas>=2.2",
    "numpy>=1.26",
    "pyarrow>=14.0",
    "pyyaml>=6.0",
    "typer>=0.12",
    "matplotlib>=3.8",
]

[project.optional-dependencies]
dev = ["pytest>=8.0"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["propbt*"]
